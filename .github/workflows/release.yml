name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:extension:store
      - run: npm run build
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build macOS disk image
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Smoke test Linux app
        if: matrix.platform == 'linux'
        run: xvfb-run -a release/linux-unpacked/one-brain --no-sandbox --smoke-test
      - name: Smoke test Windows app
        if: matrix.platform == 'win'
        run: '& "release/win-unpacked/One Brain.exe" --smoke-test'
        shell: pwsh
      - name: Smoke test macOS app
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: '"release/mac-arm64/One Brain.app/Contents/MacOS/One Brain" --smoke-test'
      - name: Print installer sizes
        if: always()
        run: node scripts/print-sizes.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: One-Brain-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/One-Brain-*
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: One-Brain-*
          path: release
          merge-multiple: true
      - name: Create stable installer names
        shell: bash
        run: |
          set -euo pipefail
          copy_installer() {
            local source="$1"
            local stable_name="$2"
            if [[ ! -f "$source" ]]; then
              echo "::error::Required installer is missing: ${source}"
              exit 1
            fi
            cp "$source" "release/${stable_name}"
          }
          copy_installer 'release/One-Brain-1.5.1-linux-x86_64.AppImage' 'One-Brain-linux-x64.AppImage'
          copy_installer 'release/One-Brain-1.5.1-win-x64.exe' 'One-Brain-win-x64.exe'
          copy_installer 'release/One-Brain-1.5.1-mac-arm64.dmg' 'One-Brain-mac-arm64.dmg'
      - uses: softprops/action-gh-release@v2
        with:
          files: release/One-Brain-*
          generate_release_notes: true
