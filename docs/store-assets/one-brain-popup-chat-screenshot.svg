<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">One Brain popup with a chat page</title><desc id="desc">Repository generated layout reference for the store screenshot. Replace with a real app screenshot before submission.</desc>
