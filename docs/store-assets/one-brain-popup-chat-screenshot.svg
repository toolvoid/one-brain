  <rect x="914" y="393" width="322" height="158" rx="9" fill="#11191f" stroke="#34414a"/><rect x="931" y="411" width="15" height="15" rx="3" fill="none" stroke="#6a7a84"/><text x="957" y="423" fill="#e8f0f2" font-family="system-ui,sans-serif" font-size="13" font-weight="600">A project note from your memory</text><text x="931" y="451" fill="#a9b7bf" font-family="system-ui,sans-serif" font-size="12">“The next milestone is to finish the small</text><text x="931" y="470" fill="#a9b7bf" font-family="system-ui,sans-serif" font-size="12">prototype and ask two people for feedback.”</text><text x="931" y="514" fill="#76d6ca" font-family="system-ui,sans-serif" font-size="12">Review context before sending</text>
