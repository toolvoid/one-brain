<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Brain recovery paused</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.55 system-ui, sans-serif; background: #0b1020; color: #e7edf7; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(560px, calc(100vw - 48px)); padding: 28px; border: 1px solid #34415a; border-radius: 16px; background: #121a2b; box-shadow: 0 24px 70px #0007; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { margin: 0; color: #b6c2d3; }
    .notice { margin-bottom: 18px; padding: 10px 12px; border-left: 3px solid #e5ae4b; border-radius: 5px; color: #f2d28c; background: #332a1a; }
  </style>
</head>
<body>
  <main role="status">
    <p class="notice">One Brain paused automatic recovery after repeated window crashes.</p>
    <h1>Graphics or renderer recovery paused</h1>
    <p>Close this window and reopen One Brain. The last lifecycle events are available in Settings → Diagnostics after the main window opens.</p>
  </main>
</body>
</html>
